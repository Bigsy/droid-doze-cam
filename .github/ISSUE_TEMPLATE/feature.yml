name: Feature request / 功能建议
description: Explain a concrete use case or improvement.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Include device/platform requirements and how the result could be validated.
