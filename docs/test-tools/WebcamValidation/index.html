<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DroidDozeCam 独立接收验收</title>
<style>body{font:16px system-ui;margin:24px;background:#111827;color:#e5e7eb}h1{font-size:24px}button{padding:12px 18px;margin:0 8px 12px 0;font-size:16px}video{display:block;width:min(100%,960px);aspect-ratio:16/9;background:#000;object-fit:contain}pre{line-height:1.5;white-space:pre-wrap}small{color:#9ca3af}</style>
<h1>DroidDozeCam → OBS Virtual Camera → 浏览器</h1><p>独立浏览器通过系统摄像头接口读取。只在本机预览，不录音、不上传视频。</p>
<button id="start">开始验收（OBS Virtual Camera）</button><button id="stop" disabled>停止接收</button>
<video id="video" autoplay muted playsinline></video><pre id="status">等待开始</pre><small>统计证据仅写入本机；不会保存原始画面。</small>
<script>
const video=document.querySelector('video'), status=document.querySelector('#status'), start=document.querySelector('#start'),stop=document.querySelector('#stop');
let stream,timer,started,frames=0,lastMedia=-1,lastFrameAt=0,lastPixels,lastSampleTime=0,samples=0,changedSamples=0,litSamples=0,mean=0,stddev=0,difference=0,baseFrames=0,lastStatsAt=0,receiveFPS=0,settings={},records=[];
const canvas=document.createElement('canvas'); canvas.width=32;canvas.height=18;const ctx=canvas.getContext('2d',{willReadFrequently:true});
async function report(event){const now=performance.now();const data={event,at:new Date().toISOString(),device:stream?.getVideoTracks()[0]?.label,settings,elapsedSeconds:started?(now-started)/1000:0,frames,receiveFPS,samples,changedSamples,litSamples,meanLuma:mean,spatialStdDev:stddev,meanPixelChange:difference,frameAgeMs:now-lastFrameAt,trackState:stream?.getVideoTracks()[0]?.readyState};status.textContent=JSON.stringify(data,null,2);records.push(data);await fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
function frame(now,metadata){if(!stream)return;frames++;lastFrameAt=now;lastMedia=metadata.mediaTime;if(now-lastSampleTime>=200){ctx.drawImage(video,0,0,32,18);const px=ctx.getImageData(0,0,32,18).data;const gray=[];let sum=0,sq=0,delta=0;for(let i=0;i<px.length;i+=4){let l=.2126*px[i]+.7152*px[i+1]+.0722*px[i+2];gray.push(l);sum+=l;sq+=l*l;if(lastPixels)delta+=Math.abs(l-lastPixels[i/4]);}mean=sum/gray.length;stddev=Math.sqrt(Math.max(0,sq/gray.length-mean*mean));difference=lastPixels?delta/gray.length:0;samples++;if(mean>5&&stddev>3)litSamples++;if(lastPixels&&difference>.2)changedSamples++;lastPixels=gray;lastSampleTime=now;}video.requestVideoFrameCallback(frame);}
start.onclick=async()=>{try{start.disabled=true;const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');let target=devices.find(d=>d.label.includes('OBS Virtual Camera'));if(!target&&devices.length===1)target=devices[0];if(!target)throw Error('没有找到唯一的 OBS 摄像头，请检查虚拟摄像头已启动。');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{...(target.deviceId?{deviceId:{exact:target.deviceId}}:{}),width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});const track=stream.getVideoTracks()[0];if(!track.label.includes('OBS Virtual Camera')){track.stop();stream=null;throw Error('所选设备不是 OBS Virtual Camera，已停止。');}settings=track.getSettings();delete settings.deviceId;delete settings.groupId;video.srcObject=stream;await video.play();started=performance.now();lastStatsAt=started;video.requestVideoFrameCallback(frame);stop.disabled=false;await report('started');timer=setInterval(()=>{const now=performance.now();receiveFPS=(frames-baseFrames)*1000/(now-lastStatsAt);baseFrames=frames;lastStatsAt=now;report('sample').catch(console.error);},2000);}catch(error){status.textContent=error.name+': '+error.message;start.disabled=false;fetch('/report',{method:'POST',body:JSON.stringify({event:'error',message:String(error),constraint:error.constraint})});}};
stop.onclick=async()=>{clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());await report('stopped');stream=null;video.srcObject=null;stop.disabled=true;start.disabled=true;};
</script></html>
